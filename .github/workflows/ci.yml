name: CI & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Fase 4.4 — anggaran bundel (gzip ≤ 200 kB total, ≤ 150 kB per berkas) agar tetap ringan di jaringan 3G Gayo
      - name: Check bundle budget
        run: npm run check:bundle

      # Fase 4.4 — smoke test API offline: server dinyalakan tanpa kunci; semua endpoint harus menjawab JSON (degraded boleh, 5xx tidak)
      - name: API smoke test (offline-tolerant)
        run: npm run smoke
