name: CI & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hardening (temuan audit F-02): token CI hanya butuh baca repositori.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Action dipin ke SHA commit (bukan tag mutable) — temuan audit F-02.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # F-10/A-2: cakupan diukur lalu dinilai terhadap ambang gagal (baris ≥ 95 %, cabang ≥ 80 %,
      # fungsi ≥ 92 %) + cetak tren vs scripts/coverage-baseline.json — regresi cakupan menggagalkan CI
      - name: Test coverage gate
        run: npm run check:coverage

      # F-01: kerentanan pada dependensi produksi = gagal; temuan dev-only dicatat di SECURITY.md
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high

      # F-14: outlook musiman harus berlaku (gagal bila kedaluwarsa)
      - name: Cek kesegaran outlook musiman
        run: npm run check:outlook

      # F-16: inventaris placeholder Gayo (informatif sampai H-4 selesai)
      - name: Inventaris i18n Gayo
        run: npm run check:i18n

      # Fase design/UX (P1 selesai 2026-10-16): nol utilitas teks beropasitas + seluruh pasangan
      # token lulus WCAG AA. Mode --strict = regresi kontras MENGGAGALKAN build.
      - name: Gerbang kontras desain (strict)
        run: npm run check:contrast -- --strict

      - name: Build production bundle
        run: npm run build

      # Fase design/UX (P3 selesai 2026-10-16): skala tipografi berbasis token — tanpa teks < 16 px
      # untuk teks isi, tanpa ukuran bawaan kecil (text-xs/text-sm), kontrol formulir >= 16 px,
      # tanpa `truncate` (label Gayo memanjang), dan font data ter-self-host (public/fonts -> dist/fonts).
      - name: Gerbang tipografi (skala token + font)
        run: npm run check:typography

      # Fase 4.4 — anggaran bundel (gzip ≤ 200 kB total, ≤ 150 kB per berkas) agar tetap ringan di jaringan 3G Gayo
      - name: Check bundle budget
        run: npm run check:bundle

      # Fase 4.4 — smoke test API offline: server dinyalakan tanpa kunci; semua endpoint harus menjawab JSON (degraded boleh, 5xx tidak)
      - name: API smoke test (offline-tolerant)
        run: npm run smoke
