name: CI & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hardening (temuan audit F-02): token CI hanya butuh baca repositori.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Action dipin ke SHA commit (bukan tag mutable) — temuan audit F-02.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fase design/UX (P6 selesai 2026-10-16): ESLint + eslint-plugin-jsx-a11y + react-hooks.
      # Menjaga temuan aksesibilitas JSX (alt-text, anchor-is-valid, klik pada elemen statis, dst.)
      # dan hook React agar tidak kembali. 0 berkas diabaikan; temuan = gagal.
      - name: Lint (ESLint + jsx-a11y + react-hooks)
        run: npm run lint

      - name: Run unit tests
        run: npm test

      # F-10/A-2: cakupan diukur lalu dinilai terhadap ambang gagal (baris ≥ 95 %, cabang ≥ 80 %,
      # fungsi ≥ 92 %) + cetak tren vs scripts/coverage-baseline.json — regresi cakupan menggagalkan CI
      - name: Test coverage gate
        run: npm run check:coverage

      # F-01: kerentanan pada dependensi produksi = gagal; temuan dev-only dicatat di SECURITY.md
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high

      # F-14: outlook musiman harus berlaku (gagal bila kedaluwarsa)
      - name: Cek kesegaran outlook musiman
        run: npm run check:outlook

      # F-16: inventaris placeholder Gayo (informatif sampai H-4 selesai)
      - name: Inventaris i18n Gayo
        run: npm run check:i18n

      # Fase design/UX (P1 selesai 2026-10-16): nol utilitas teks beropasitas + seluruh pasangan
      # token lulus WCAG AA. Mode --strict = regresi kontras MENGGAGALKAN build.
      - name: Gerbang kontras desain (strict)
        run: npm run check:contrast -- --strict

      - name: Build production bundle
        run: npm run build

      - name: Verify build provenance and local assets
        run: npm run check:build-info

      # Fase design/UX (P3 selesai 2026-10-16): skala tipografi berbasis token — tanpa teks < 16 px
      # untuk teks isi, tanpa ukuran bawaan kecil (text-xs/text-sm), kontrol formulir >= 16 px,
      # tanpa `truncate` (label Gayo memanjang), dan font data ter-self-host (public/fonts -> dist/fonts).
      - name: Gerbang tipografi (skala token + font)
        run: npm run check:typography

      # Fase 4.4 — anggaran bundel (gzip ≤ 200 kB total, ≤ 150 kB per berkas) agar tetap ringan di jaringan 3G Gayo
      - name: Check bundle budget
        run: npm run check:bundle

      # Fase 4.4 — smoke test API offline: server dinyalakan tanpa kunci; semua endpoint harus menjawab JSON (degraded boleh, 5xx tidak)
      - name: API smoke test (offline-tolerant)
        run: npm run smoke

      # F-39 (audit 23 Okt 2026): uji aksesibilitas berbasis BROWSER dulu manual
      # (docs/how-to/09-uji-browser-a11y.md). Tiga temuan Sprint A — label ganda,
      # fokus masuk ke panel terlipat, target sentuh < 24 px — lolos dari semua
      # gerbang statis karena hanya muncul setelah halaman dirender. Sekarang axe-core
      # berjalan di tiga permukaan × tiga lebar (1920/1440/1100) sejak 2.3.4; 1 pelanggaran = gagal.
      # Lebar 1100 penting: di Mode 2 (≤ 1200 px) letak tombol perlebar panel & strip jam berubah,
      # dan itulah bentuk yang tidak pernah diaudit saat gerbangnya masih 1920 saja.
      # Browser dipasang ke .cache/browsers (gitignored) dan path-nya diberikan lewat CHROME_PATH
      # supaya gerbang tidak pernah "lolos" karena diam-diam melewati pemeriksaan.
      # Versi browser diturunkan dari puppeteer-core, bukan ditulis tangan: Chrome 131 +
      # puppeteer-core 25 terbukti menggantung di CDP (Runtime.evaluate timeout), dan
      # pin manual akan basi setiap kali dependensi naik.
      - name: Siapkan browser headless (gerbang a11y)
        run: |
          VERSION=$(node -e "import('puppeteer-core/internal/revisions.js').then((m) => console.log(m.PUPPETEER_REVISIONS['chrome-headless-shell']))")
          echo "chrome-headless-shell@$VERSION"
          npx --yes @puppeteer/browsers install "chrome-headless-shell@$VERSION" --path .cache/browsers
          echo "CHROME_PATH=$PWD/$(find .cache/browsers -type f -name chrome-headless-shell | head -1)" >> "$GITHUB_ENV"

      - name: Gerbang aksesibilitas browser (axe-core · 3 permukaan × 3 lebar)
        run: npm run check:a11y
